
name: Build Fusion DarkRP Ultimate

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fusion-darkrp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: BONELAB Quest - Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. RECUPERATION DU DEPOT
      # --------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize build log
        run: |
          mkdir -p artifacts
          touch build.log

      # --------------------------------------------------
      # 2. INSTALLATION DES OUTILS
      # --------------------------------------------------

      - name: Install .NET SDK 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow numpy

      # --------------------------------------------------
      # 3. VERIFICATION DE LA STRUCTURE DU MOD
      # --------------------------------------------------

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "FusionDarkRP-Ultimate.sln"
            "FusionDarkRP-Ultimate.csproj"
            "Tools/GenerateModels.py"
            "Tools/modellib.py"
            "Tools/texlib.py"
            "Properties/AssemblyInfo.cs"
            "Libs/MelonLoader.dll"
            "Libs/Il2Cppmscorlib.dll"
            "Libs/Il2CppInterop.Runtime.dll"
            "Libs/Il2CppSLZ.Marrow.dll"
            "Libs/LabFusion.dll"
            "Libs/BoneLib.dll"
            "Libs/Il2CppAssemblies/Assembly-CSharp.dll"
            "Libs/Il2CppAssemblies/Unity.TextMeshPro.dll"
            "Libs/Il2CppAssemblies/UnityEngine.UI.dll"
            "Libs/UnityEngine.CoreModule.dll"
            "Libs/UnityEngine.IMGUIModule.dll"
            "Libs/UnityEngine.PhysicsModule.dll"
            "Libs/UnityDependencies/UnityEngine.AudioModule.dll"
            "Libs/UnityDependencies/UnityEngine.UIModule.dll"
            "Libs/UnityDependencies/UnityEngine.TextCoreTextEngineModule.dll"
            "Libs/UnityDependencies/UnityEngine.TextCoreFontEngineModule.dll"
            "Libs/UnityDependencies/UnityEngine.TextRenderingModule.dll"
            "Libs/UnityDependencies/UnityEngine.ImageConversionModule.dll"
            "Libs/UnityDependencies/UnityEngine.VideoModule.dll"
          )

          MISSING=0

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              MISSING=1
            else
              echo "OK: $FILE"
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "Project structure validation failed."
            exit 1
          fi

          echo "All required files are present."

      # --------------------------------------------------
      # 4. GENERATION DES MODELES 3D
      # --------------------------------------------------

      - name: Generate BONELAB models and textures
        shell: bash
        run: |
          set -euo pipefail

          python Tools/GenerateModels.py

          echo "Model generation completed."

          if [ ! -d Assets/Models/Money ]; then
            echo "::error::Money models directory missing."
            exit 1
          fi

          if [ ! -d Assets/Models/RP ]; then
            echo "::error::RP models directory missing."
            exit 1
          fi

      # --------------------------------------------------
      # 5. RESTAURATION DES DEPENDANCES .NET
      # --------------------------------------------------

      - name: Restore NuGet packages
        shell: bash
        run: |
          set -o pipefail
          dotnet restore FusionDarkRP-Ultimate.sln \
            --verbosity minimal 2>&1 | tee -a build.log

      # --------------------------------------------------
      # 6. COMPILATION RELEASE
      # --------------------------------------------------

      - name: Build Fusion DarkRP Ultimate
        shell: bash
        run: |
          set -o pipefail

          dotnet build FusionDarkRP-Ultimate.sln \
            --configuration Release \
            --no-restore \
            --verbosity minimal \
            -p:ContinuousIntegrationBuild=true \
            2>&1 | tee -a build.log

      # --------------------------------------------------
      # 7. VERIFICATION DE LA DLL
      # --------------------------------------------------

      - name: Verify compiled assembly
        shell: bash
        run: |
          set -euo pipefail

          DLL="bin/Release/FusionDarkRPUltimate.dll"

          if [ ! -f "$DLL" ]; then
            echo "::error::FusionDarkRPUltimate.dll was not generated."
            exit 1
          fi

          if [ ! -s "$DLL" ]; then
            echo "::error::Generated DLL is empty."
            exit 1
          fi

          mkdir -p artifacts/Mods

          cp "$DLL" artifacts/Mods/FusionDarkRPUltimate.dll

          if [ -f "bin/Release/FusionDarkRPUltimate.pdb" ]; then
            cp bin/Release/FusionDarkRPUltimate.pdb artifacts/
          fi

          echo "DLL successfully generated."
          ls -lh artifacts/Mods/

      # --------------------------------------------------
      # 8. INFORMATIONS DE VERSION
      # --------------------------------------------------

      - name: Generate build manifest
        if: success()
        shell: bash
        run: |
          {
            echo "Fusion DarkRP Ultimate"
            echo "Version: 3.8.0-EOS"
            echo "Target: BONELAB Quest / LabFusion"
            echo "Framework: .NET 6"
            echo "Configuration: Release"
            echo "Assembly: FusionDarkRPUltimate.dll"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Build date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            sha256sum artifacts/Mods/FusionDarkRPUltimate.dll
          } > artifacts/BUILD_INFO.txt

      # --------------------------------------------------
      # 9. ARCHIVE DU CODE SOURCE
      # --------------------------------------------------

      - name: Package source archive
        if: success()
        shell: bash
        run: |
          zip -r artifacts/FusionDarkRP-Ultimate-SOURCE.zip . \
            -x ".git/*" \
               "bin/*" \
               "obj/*" \
               "artifacts/*" \
               ".github/*"

      # --------------------------------------------------
      # 10. DEPOT DES ARTEFACTS COMPILATION
      # --------------------------------------------------

      - name: Upload BONELAB mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FusionDarkRP-Ultimate-BONELAB-Quest
          path: |
            artifacts/Mods/FusionDarkRPUltimate.dll
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FusionDarkRP-Ultimate-SOURCE
          path: artifacts/FusionDarkRP-Ultimate-SOURCE.zip
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 11. CONSERVATION DES JOURNAUX
      # --------------------------------------------------

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FusionDarkRP-Build-Logs
          path: |
            build.log
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 12. RAPPORT FINAL
      # --------------------------------------------------

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Fusion DarkRP Ultimate"
            echo ""
            echo "Target: BONELAB Quest / LabFusion"
            echo ""
            if [ -f artifacts/Mods/FusionDarkRPUltimate.dll ]; then
              echo "### BUILD SUCCESS"
              echo ""
              echo "DLL successfully generated."
            else
              echo "### BUILD FAILED"
              echo ""
              echo "Check the build diagnostics artifact."
            fi
            echo ""
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
